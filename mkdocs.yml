site_name: simplesvgd
site_description: Stein Variational Gradient Descent with optional L-BFGS preconditioning
site_url: https://larsgeb.github.io/simpleSVGD/
repo_name: larsgeb/simpleSVGD
repo_url: https://github.com/larsgeb/simpleSVGD
edit_uri: edit/master/docs/

nav:
  - Home: index.md
  - Notebooks:
      - Tutorial: notebooks/Tutorial on using simplesvgd.ipynb
      - PyTorch bridge: notebooks/Using SVGD + Torch algorithms.ipynb
  - API Reference: api.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
