[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpleSVGD"
version = "1.0.0"
description = "Stein Variational Gradient Descent with optional L-BFGS preconditioning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Lars Gebraad", email = "lars.gebraad@erdw.ethz.ch"},
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
]
dependencies = [
    "numpy>=2.2",
    "tqdm",
]

[project.optional-dependencies]
torch = ["torch"]
viz = ["matplotlib"]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[project.urls]
Homepage = "https://github.com/larsgeb/simpleSVGD"
Issues = "https://github.com/larsgeb/simpleSVGD/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simpleSVGD"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
