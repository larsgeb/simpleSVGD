[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleSVGD"
version = "1.0.0"
description = "Stein Variational Gradient Descent with optional L-BFGS preconditioning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Lars Gebraad", email = "lars.gebraad@erdw.ethz.ch"},
]
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ty"]
torch = ["torch"]
viz = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/larsgeb/simpleSVGD"
Issues = "https://github.com/larsgeb/simpleSVGD/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
